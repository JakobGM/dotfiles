[settings]
experimental = true
minimum_release_age = "5d"
trusted_config_paths = ["/home/jakobgm/.herdr/worktrees"]

# Globally-installed runtimes. Picked up in any shell via the mise activate hook
# in config.fish. Mason (in nvim) shells out to `npm`, so Node must be on PATH.
[tools]
node = "lts"
# Claude Code tracks the newest release. With auto_update, mise checks for a
# newer version at most once a day (tool_update.check_duration) when claude
# runs or a shell prompt draws, and installs it. minimum_release_age above
# still holds back releases younger than 5 days. Claude Code's own updater is
# off (DISABLE_AUTOUPDATER in fish/conf.d/00-env.fish.tmpl), so mise is the
# only thing that installs Claude Code.
# https://mise.jdx.dev/dev-tools/#automatic-tool-updates
claude = { version = "latest", auto_update = true }
